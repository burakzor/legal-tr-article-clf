# Experiment 2 (input length), linear SVM. Paths are relative to the repo root.
# Same data, input lengths, TF-IDF settings and evaluation as input_length_logreg.yaml, and the
# same model settings and search grid as svm.yaml, so k = full reproduces the svm.yaml result.
seed: 42
data_version: v1
out_dir: results/svm/svm_input_length

input_lengths: [5, 10, 20, 40, 80, 160, null]   # null = the whole article (max 1,000 words)

tfidf:                          # identical to input_length_logreg.yaml and svm.yaml; fitted on train only, separately for each k
  ngram_range: [1, 2]
  min_df: 2
  max_features: 100000
  sublinear_tf: true

model:                          # identical to svm.yaml
  max_iter: 5000

search:                         # identical to svm.yaml; grid searched on dev for every k
  C: [1.0e-2, 3.0e-2, 1.0e-1, 3.0e-1, 1.0, 3.0]
  class_weight: [balanced, none]

bootstrap:
  n: 1000                       # document-level resamples for the test macro-F1 interval
