# Linear SVM on TF-IDF of full articles. Paths are relative to the repo root.
seed: 42
data_version: v1
out_dir: outputs/svm

tfidf:                          # same settings as logistic regression; fitted on train only
  ngram_range: [1, 2]
  min_df: 2
  max_features: 100000
  sublinear_tf: true

model:
  max_iter: 5000

search:                         # grid searched on dev; write floats as 1.0e-2 (YAML reads 1e-2 as text)
  C: [1.0e-2, 3.0e-2, 1.0e-1, 3.0e-1, 1.0, 3.0]
  class_weight: [balanced, none]

fusion:                         # decision scores saved for the feature fusion experiment
  folds: 5                      # train scores are out-of-fold, folds grouped by document

bootstrap:
  n: 1000                       # document-level resamples for the test macro-F1 interval
