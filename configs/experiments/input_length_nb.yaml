# Experiment 2 (input length), Naive Bayes.
# Run: python -m legalclf.classical.input_length --config configs/experiments/input_length_nb.yaml
seed: 42
model: naive_bayes
data_dir: data/processed/v1
out_dir: outputs/input_length/naive_bayes

# First k words of each article (train, dev and test are all cut to k).
# "full" = whole article (v1 already caps it at 1,000 words). Median article ≈ 70 words.
lengths: [5, 10, 20, 40, 80, 160, 320, full]

tfidf:
  fixed:              # passed to TfidfVectorizer as is (lowercasing is Turkish-aware)
    min_df: 2
    sublinear_tf: true
  grid:               # tuned on dev for every length
    ngram_range: [[1, 1], [1, 2]]

model_grid:           # tuned on dev for every length
  variant: [multinomial, complement]  # ComplementNB is designed for imbalanced classes
  alpha: [0.0001, 0.0003, 0.001, 0.003, 0.01, 0.03, 0.1, 0.3, 1.0, 3.0, 10.0]
  fit_prior: [true, false]            # false = uniform class prior (MultinomialNB only)

bootstrap:            # CI of test macro-F1, resampling documents
  n: 1000
  level: 0.95
