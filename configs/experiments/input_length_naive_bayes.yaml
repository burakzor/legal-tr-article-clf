# Experiment 2 (input length), Naive Bayes, LR format. Paths are relative to the repo root.
# Same data, input lengths, TF-IDF settings and evaluation as input_length_logreg.yaml,
# so the only difference from the logistic regression run is the model.
seed: 42
data_version: v1
out_dir: results/naive_bayes

input_lengths: [5, 10, 20, 40, 80, 160, null]   # null = the whole article (max 1,000 words)

tfidf:                          # identical to input_length_logreg.yaml; fitted on train only, separately for each k
  ngram_range: [1, 2]
  min_df: 2
  max_features: 100000
  sublinear_tf: true

search:                         # grid searched on dev for every k
  variant: [multinomial, complement]   # ComplementNB is designed for imbalanced classes
  alpha: [0.0001, 0.0003, 0.001, 0.003, 0.01, 0.03, 0.1, 0.3, 1.0, 3.0, 10.0]
  fit_prior: [true, false]             # MultinomialNB only; false = uniform class prior

bootstrap:
  n: 1000                       # document-level resamples for the test macro-F1 interval
